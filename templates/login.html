<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Phishing Website Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fadeIn 0.8s ease-in-out; }
    @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
    .dark-mode { background: linear-gradient(to bottom right, #0f172a, #1e293b); color: white; }
    .light-mode { background: linear-gradient(to bottom right, #e0f2fe, #f1f5f9); color: #111827; }
  </style>
</head>
<body id="page" class="dark-mode min-h-screen flex flex-col transition-all duration-700">

  <!-- Navbar -->
  <nav class="bg-gray-800/80 backdrop-blur-md p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold text-blue-400">🔒 Phishing Detector</h1>
    <div class="flex items-center space-x-6">
      <a href="/" class="hover:text-blue-400">Home</a>
      <a href="/about" class="hover:text-blue-400">About</a>
      <a href="/contact" class="hover:text-blue-400">Contact</a>
      <button id="toggleTheme" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded-md text-sm">☀️ Light</button>
    </div>
  </nav>

  <!-- Login Form -->
  <main class="flex flex-col items-center justify-center flex-grow p-6 fade-in">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-700">
      <h2 class="text-3xl font-bold mb-6 text-center text-blue-400">Welcome Back</h2>
      
      <form id="loginForm" class="flex flex-col space-y-4">
        <div>
          <label class="block text-gray-400 mb-1">Email Address</label>
          <input type="email" id="email" required class="w-full p-2 rounded-md bg-gray-700 text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Password</label>
          <input type="password" id="password" required class="w-full p-2 rounded-md bg-gray-700 text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-md transition-all">
          Login
        </button>
      </form>

      <div class="my-4 flex items-center justify-between text-gray-400 text-sm">
        <span class="w-1/5 border-b border-gray-600"></span>
        <span class="text-xs uppercase">or continue with</span>
        <span class="w-1/5 border-b border-gray-600"></span>
      </div>

      <button id="googleBtn" class="w-full bg-white text-gray-900 font-semibold py-2 rounded-md flex items-center justify-center hover:bg-gray-100 transition-all">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2">
        Google
      </button>

      <p class="mt-6 text-center text-gray-400 text-sm">
        Don't have an account? <a href="/signup" class="text-blue-400 hover:underline">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="bg-gray-800 text-center py-4 text-gray-400 text-sm">
    © 2025 | Developed by <span class="text-blue-400 font-semibold">Rohit Yadav</span>
  </footer>

  <!-- Scripts -->
  <script type="module">
    import { loginWithGoogle, loginWithEmail } from "/static/js/auth.js";

    document.getElementById('googleBtn').addEventListener('click', loginWithGoogle);

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      loginWithEmail(email, pass);
    });
  </script>

  <script>
    const toggleBtn = document.getElementById("toggleTheme");
    const page = document.getElementById("page");
    let dark = true;
    toggleBtn.addEventListener("click", () => {
      dark = !dark;
      if (dark) {
        page.classList.replace("light-mode", "dark-mode");
        toggleBtn.textContent = "☀️ Light";
      } else {
        page.classList.replace("dark-mode", "light-mode");
        toggleBtn.textContent = "🌙 Dark";
      }
    });
  </script>
</body>
</html>
