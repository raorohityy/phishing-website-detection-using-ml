<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Phishing Website Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .dark-mode {
      background: linear-gradient(to bottom right, #0f172a, #1e293b);
      color: white;
    }

    .light-mode {
      background: linear-gradient(to bottom right, #e0f2fe, #f1f5f9);
      color: #111827;
    }
  </style>
</head>

<body id="page" class="dark-mode min-h-screen flex flex-col transition-all duration-700">

  <!-- Navbar -->
  <nav class="bg-gray-800/80 backdrop-blur-md p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold text-blue-400">🔒 Phishing Detector</h1>

    <div class="flex items-center space-x-6">
      <a href="/" class="hover:text-blue-400">Home</a>
      <a href="/about" class="hover:text-blue-400">About</a>
      <a href="/contact" class="text-blue-400 font-semibold">Contact</a>
      <a href="/login" id="nav-login" class="hover:text-blue-400">Login</a>
      <a href="/signup" id="nav-signup"
        class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md text-sm transition-all">Sign Up</a>
      <button id="nav-logout" class="text-red-400 hover:text-red-300 hidden" style="display: none;">Logout</button>

      <!-- Theme Toggle -->
      <button id="toggleTheme" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded-md text-sm">
        ☀️ Light
      </button>
    </div>
  </nav>

  <!-- Contact Section -->
  <main class="flex flex-col items-center justify-center flex-grow p-6 fade-in">
    <h2 class="text-3xl font-bold mb-4 text-blue-400">Contact Us</h2>
    <p class="text-gray-300 mb-6 max-w-xl text-center">
      Got feedback or facing issues? Reach out to us through the form below — we’d love to hear from you!
    </p>

    <!-- Message Container -->
    <div id="messageContainer" class="hidden mb-4 p-3 rounded-md text-white text-center"></div>

    <div class="text-sm text-gray-400 mb-4 text-center">
      *Note: Ensure backend environment variables are set for email sending.
    </div>

    <form id="contactForm" class="bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-md">
      <input type="email" name="email" id="email" placeholder="Your Email" required
        class="w-full mb-3 p-2 rounded-md text-black focus:outline-none">
      <textarea name="message" id="message" placeholder="Your Message..." rows="4" required
        class="w-full mb-3 p-2 rounded-md text-black focus:outline-none"></textarea>
      <button type="submit" id="submitBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md">
        Send Message
      </button>
    </form>

    <script>
      const contactForm = document.getElementById('contactForm');
      const messageContainer = document.getElementById('messageContainer');
      const submitBtn = document.getElementById('submitBtn');

      // Configuration - pointing to Render backend
      const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://127.0.0.1:5000'
        : 'https://phishing-website-detection-using-ml-kvue.onrender.com';

      contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Reset UI
        messageContainer.classList.add('hidden');
        messageContainer.classList.remove('bg-green-600', 'bg-red-600');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;

        try {
          const response = await fetch(`${API_BASE_URL}/contact`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, message })
          });

          const data = await response.json();

          messageContainer.classList.remove('hidden');
          if (data.success || response.ok) {
            messageContainer.classList.add('bg-green-600');
            messageContainer.textContent = '✅ Message Sent Successfully!';
            contactForm.reset();
          } else {
            throw new Error(data.error || 'Failed to send message');
          }
        } catch (error) {
          console.error('Error:', error);
          messageContainer.classList.remove('hidden');
          messageContainer.classList.add('bg-red-600');
          messageContainer.textContent = `❌ Error: ${error.message}`;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Message';
        }
      });
    </script>

    <div class="mt-6 flex justify-center space-x-6 text-2xl">
      <a href="#" class="text-blue-400 hover:text-blue-300"><i class="bi bi-linkedin"></i></a>
      <a href="#" class="text-gray-300 hover:text-white"><i class="bi bi-github"></i></a>
      <a href="#" class="text-pink-400 hover:text-pink-300"><i class="bi bi-envelope-fill"></i></a>
    </div>
  </main>

  <footer class="bg-gray-800 text-center py-4 text-gray-400 text-sm">
    © 2025 | Developed by <span class="text-blue-400 font-semibold">Rohit Yadav</span>
  </footer>

  <!-- Theme Toggle Script -->
  <script>
    const toggleBtn = document.getElementById("toggleTheme");
    const page = document.getElementById("page");
    let dark = true;

    toggleBtn.addEventListener("click", () => {
      dark = !dark;
      if (dark) {
        page.classList.replace("light-mode", "dark-mode");
        toggleBtn.textContent = "☀️ Light";
      } else {
        page.classList.replace("dark-mode", "light-mode");
        toggleBtn.textContent = "🌙 Dark";
      }
    });
  </script>

  <!-- Auth Monitor and Auto-fill -->
  <script type="module">
    import { monitorAuthState } from "/static/js/auth.js";
    import { app } from "/static/js/firebase-config.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    // Monitor auth state for navbar
    monitorAuthState();

    // Auto-fill email if logged in
    const auth = getAuth(app);
    onAuthStateChanged(auth, (user) => {
      if (user && user.email) {
        const emailInput = document.querySelector('input[name="email"]');
        if (emailInput) {
          emailInput.value = user.email;
          // Removed readOnly and gray styling effectively making it editable "not stuck"
          // emailInput.readOnly = true; 
          // emailInput.classList.add("bg-gray-700", "cursor-not-allowed"); 
        }
      }
    });
  </script>
</body>

</html>
